# Render blueprint for the public demo: New > Blueprint > pick this repo > Apply.
# The free plan sleeps when idle and its disk is temporary: on every start it goes back to the files
# the build produced. So the demo database is migrated and seeded during the build, and a waking
# service only has to start gunicorn. Visitors' orders last until the service next sleeps.
services:
  - type: web
    name: cravio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_demo
    startCommand: gunicorn config.wsgi --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      # No ANTHROPIC_API_KEY on purpose: visitors use their own key in the chat panel.
